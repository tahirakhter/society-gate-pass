services:
  postgres:
    image: postgres:16-alpine
    container_name: society-gate-pass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: society_gate_pass
    ports:
      # 5433 avoids colliding with a locally installed/default PostgreSQL server.
      # "${POSTGRES_PORT:-5433}:5432"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d society_gate_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
